name: control_financiero
description: "Application to manage personal finances"
publish_to: 'none'
version: 0.3.0+12

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  excel: ^2.1.0
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  sqflite: ^2.4.2
  intl: ^0.20.2
  equatable: ^2.0.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  timeago: ^3.6.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4
  flutter_svg: ^2.2.4
  file_picker: ^11.0.2
  encrypt: ^5.0.3
  textfield_tags: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_prod_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true

  image_path: "assets/icons/app_prod_icon.png"

  flavors:
    dev:
      image_path: "assets/icons/app_dev_icon.png"
    prod:
      image_path: "assets/icons/app_prod_icon.png"
