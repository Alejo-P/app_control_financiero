name: control_financiero
description: "Application to manage personal finances"
publish_to: 'none'
version: 0.3.0+12

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  sqflite: ^2.4.2
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_icons:
  android: true
  ios: true

  # Icono por defecto
  image_path: "assets/icons/app_prod_icon.png"

  # Configuración de sabores
  flavors:
    dev:
      image_path: "assets/icons/app_dev_icon.png"
    prod:
      image_path: "assets/icons/app_prod_icon.png"