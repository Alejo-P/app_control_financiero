name: Android Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existente que se desea compilar (por ejemplo, v1.1.2)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      EXPECTED_SIGNER_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}

    steps:
      - name: Descargar el código del tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Validar main y versión
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::El commit del tag no pertenece a main"
            exit 1
          }

          VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '\r')
          EXPECTED_TAG="v${VERSION%%+*}"

          if [[ "$TAG" != "$EXPECTED_TAG" ]]; then
            echo "::error::Tag $TAG incompatible con pubspec.yaml ($VERSION)"
            exit 1
          fi

          # Exigir versión estable con número de build.
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]] || {
            echo "::error::Versión inválida: se requiere X.Y.Z+BUILD"
            exit 1
          }

          DISPLAY_VERSION=$(sed -n \
            "s/^const appVersion = '\([^']*\)';[[:space:]]*$/\1/p" \
            lib/core/constants/app_strings.dart | tr -d '\r')

          [[ "$DISPLAY_VERSION" == "${VERSION%%+*}" ]] || {
            echo "::error::appVersion no coincide con pubspec.yaml"
            exit 1
          }

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
            flutter-version: '3.41.6'
            channel: stable
            cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar código
        run: flutter analyze --no-fatal-infos

      - name: Ejecutar pruebas
        run: flutter test

      - name: Restaurar y validar firma de release
        shell: bash
        env:
            KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
            RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
        run: |
            set -euo pipefail
            test -n "$KEYSTORE_BASE64" || {
            echo "::error::Falta ANDROID_RELEASE_KEYSTORE_BASE64"
            exit 1
            }
            test -n "$RELEASE_KEYSTORE_PASSWORD" || {
              echo "::error::Falta ANDROID_RELEASE_PASSWORD"
              exit 1
            }
            if [[ ! "$EXPECTED_SIGNER_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
              echo "::error::ANDROID_RELEASE_CERT_SHA256 debe contener 64 caracteres hexadecimales en minúsculas, sin separadores"
              exit 1
            fi
            KEYSTORE_PATH="$RUNNER_TEMP/mi-presupuesto-release.p12"
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > "$KEYSTORE_PATH"
            ACTUAL_SHA256=$(keytool -exportcert -keystore "$KEYSTORE_PATH" \
              -storetype PKCS12 -storepass:env RELEASE_KEYSTORE_PASSWORD \
              -alias mi-presupuesto | sha256sum | cut -d ' ' -f 1)
            if [[ "$ACTUAL_SHA256" != "$EXPECTED_SIGNER_SHA256" ]]; then
              echo "::error::El secret no contiene el certificado de release esperado"
              exit 1
            fi
            echo "RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Compilar APK de producción
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
        run: flutter build apk --release --flavor prod --dart-define=FLAVOR=prod

      - name: Verificar firma del APK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 \
            -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          CERTIFICATES=$("$APKSIGNER" verify --print-certs \
            build/app/outputs/flutter-apk/app-prod-release.apk)
          # Build Tools 37 uses "V2 Signer:" / "V3.0 Signer:" instead of "Signer #1".
          # Deduplicate the same certificate reported by multiple signature schemes.
          ACTUAL_SHA256=$(printf '%s\n' "$CERTIFICATES" \
            | sed -nE 's/^(Signer #[0-9]+|Signer \([^)]*\)|V[0-9.]+ Signer):? certificate SHA-256 digest: ([a-fA-F0-9]{64})[[:space:]]*$/\2/p' \
            | tr '[:upper:]' '[:lower:]' | sort -u)
          if [[ -z "$ACTUAL_SHA256" ]]; then
            echo "::error::No se pudo extraer el certificado de firma del APK"
            exit 1
          fi
          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SIGNER_SHA256" ]]; then
            echo "Certificado esperado: $EXPECTED_SIGNER_SHA256"
            echo "Certificado(s) obtenido(s): $ACTUAL_SHA256"
            echo "::error::El APK no tiene la firma esperada; se cancela la publicación"
            exit 1
          fi
          echo "Firma del APK coincide con el certificado de release"

      - name: Preparar archivo
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-prod-release.apk \
            "dist/mi-presupuesto-${TAG}.apk"
          # Keep generation inline: workflow_dispatch can build older tags that
          # do not contain an update-manifest script in their checkout.
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re

          apk = pathlib.Path(f"dist/mi-presupuesto-{os.environ['TAG']}.apk")
          pubspec = pathlib.Path("pubspec.yaml").read_text(encoding="utf-8")
          match = re.search(r"^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$", pubspec, re.MULTILINE)
          if not match:
              raise SystemExit("Expected version X.Y.Z+BUILD")
          version, build = match.groups()
          if os.environ['TAG'] != f"v{version}":
              raise SystemExit("Tag does not match pubspec version")
          digest = hashlib.sha256()
          with apk.open("rb") as source:
              for chunk in iter(lambda: source.read(1024 * 1024), b""):
                  digest.update(chunk)
          manifest = {"version": version, "buildNumber": int(build), "file": apk.name,
                      "size": apk.stat().st_size, "sha256": digest.hexdigest()}
          apk.with_name("update.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Crear Release en borrador con el APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "dist/mi-presupuesto-${TAG}.apk" \
            dist/update.json \
            --verify-tag \
            --draft \
            --title "Mi Presupuesto $TAG" \
            --generate-notes
