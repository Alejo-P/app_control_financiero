name: Android Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TAG: ${{ github.ref_name }}

    steps:
      - name: Descargar el código del tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar main y versión
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::El commit del tag no pertenece a main"
            exit 1
          }

          VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '\r')
          EXPECTED_TAG="v${VERSION%%+*}"

          if [[ "$TAG" != "$EXPECTED_TAG" ]]; then
            echo "::error::Tag $TAG incompatible con pubspec.yaml ($VERSION)"
            exit 1
          fi

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
            flutter-version: '3.41.6'
            channel: stable
            cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar código
        run: flutter analyze --no-fatal-infos

      - name: Ejecutar pruebas
        run: flutter test

      - name: Restaurar firma de la computadora
        shell: bash
        env:
            KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
            set -euo pipefail
            test -n "$KEYSTORE_BASE64" || {
            echo "::error::Falta ANDROID_DEBUG_KEYSTORE_BASE64"
            exit 1
            }
            mkdir -p "$HOME/.android"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"

      - name: Compilar APK de producción
        run: flutter build apk --release --flavor prod --dart-define=FLAVOR=prod

      - name: Preparar archivo
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-prod-release.apk \
            "dist/mi-presupuesto-${TAG}.apk"

      - name: Crear Release en borrador con el APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "dist/mi-presupuesto-${TAG}.apk" \
            --verify-tag \
            --draft \
            --title "Mi Presupuesto $TAG" \
            --generate-notes