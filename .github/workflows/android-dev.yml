name: Android DEV APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar código
        run: flutter analyze --no-fatal-infos

      - name: Ejecutar pruebas
        run: flutter test

      - name: Compilar APK DEV
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEV_KEYSTORE_BASE64 }}
          DEV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEV_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$DEV_KEYSTORE_BASE64" || -z "$DEV_KEYSTORE_PASSWORD" ]]; then
            echo '::error::Configura ANDROID_DEV_KEYSTORE_BASE64 y ANDROID_DEV_KEYSTORE_PASSWORD.'
            exit 1
          fi

          export DEV_KEYSTORE_PATH="$RUNNER_TEMP/mi-presupuesto-dev.p12"
          umask 077
          printf '%s' "$DEV_KEYSTORE_BASE64" | base64 --decode > "$DEV_KEYSTORE_PATH"
          unset DEV_KEYSTORE_BASE64
          keytool -list -storetype PKCS12 -keystore "$DEV_KEYSTORE_PATH" \
            -storepass:env DEV_KEYSTORE_PASSWORD -alias mi-presupuesto-dev > /dev/null

          # Start above the build numbers of earlier DEV APKs.
          flutter build apk --debug --flavor dev --dart-define=FLAVOR=dev \
            --build-number="$((100000 + GITHUB_RUN_NUMBER))"

      - name: Verificar firma del APK DEV
        shell: bash
        env:
          EXPECTED_SIGNER_SHA256: ${{ vars.ANDROID_DEV_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SIGNER_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo '::error::Configura ANDROID_DEV_CERT_SHA256 con 64 caracteres hexadecimales en minúsculas, sin separadores.'
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 \
            -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          CERTIFICATES=$("$APKSIGNER" verify --print-certs \
            build/app/outputs/flutter-apk/app-dev-debug.apk)
          # Build Tools 37 can report the same certificate for multiple signature schemes.
          ACTUAL_SHA256=$(printf '%s\n' "$CERTIFICATES" \
            | sed -nE 's/^(Signer #[0-9]+|Signer \([^)]*\)|V[0-9.]+ Signer):? certificate SHA-256 digest: ([a-fA-F0-9]{64})[[:space:]]*$/\2/p' \
            | tr '[:upper:]' '[:lower:]' | sort -u)
          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SIGNER_SHA256" ]]; then
            echo '::error::El certificado del APK DEV no coincide con ANDROID_DEV_CERT_SHA256.'
            exit 1
          fi

      - name: Subir APK DEV
        uses: actions/upload-artifact@v7
        with:
          name: mi-presupuesto-dev
          path: build/app/outputs/flutter-apk/app-dev-debug.apk
          if-no-files-found: error
